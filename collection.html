<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>দর্পণ — আমার কালেকশন</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div class="app-shell">
    <!-- Screen 4: Product collection builder (shop dashboard) -->
    <header id="site-header" data-variant="dashboard"></header>

    <main class="px-4 pb-44 pt-4">
      <!-- Shop summary -->
      <section id="shop-summary" class="rounded-2xl bg-gradient-to-br from-navy to-accent p-4 text-white shadow-lift"></section>

      <!-- Title + search -->
      <div class="mt-5 flex items-end justify-between">
        <h1 class="text-xl font-extrabold text-navy" data-i18n="col.title"></h1>
        <span id="product-count" class="text-sm text-slate-500"></span>
      </div>
      <label class="relative mt-3 block">
        <span data-icon="search" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></span>
        <input id="search" type="search" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-3 text-[15px] outline-none focus:border-accent focus:bg-white focus:ring-2 focus:ring-accent/20" data-i18n-placeholder="col.search">
      </label>

      <!-- Category tabs: পোশাক / চশমা / জুতা -->
      <div id="category-tabs" class="mt-3 grid grid-cols-3 gap-2" role="tablist"></div>

      <!-- Product grid -->
      <div id="product-grid" class="mt-4 grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Floating CTA above the bottom nav -->
    <div class="pointer-events-none fixed bottom-[76px] left-1/2 z-20 w-full max-w-md -translate-x-1/2 px-4">
      <a href="share.html" class="pointer-events-auto flex items-center justify-center gap-2 rounded-2xl bg-navy py-3.5 text-[15px] font-bold text-white shadow-lift">
        <span data-icon="qr" class="h-5 w-5"></span>
        <span data-i18n="col.makeQr"></span>
      </a>
    </div>

    <nav id="bottom-nav" data-active="collection"></nav>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/collection.js"></script>
</body>
</html>
