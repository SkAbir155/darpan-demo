<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>মায়ের দোয়া বস্ত্র বিতান — দর্পণ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <!-- Screen 6: Customer-facing storefront (what a QR scan opens).
       Defaults to the demo shop; ?shop=<id> shows any shop in mock-data.js. -->
  <div class="app-shell">
    <header id="site-header" data-variant="store"></header>

    <!-- Shop identity (filled by shop.js) -->
    <section id="store-hero" class="relative"></section>

    <main class="px-4 pb-10">
      <!-- Try-on banner -->
      <div class="mt-4 flex items-center gap-3 rounded-2xl bg-accent-50 p-3.5">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-accent text-white"><span data-icon="sparkle" class="h-6 w-6"></span></span>
        <div>
          <p class="font-bold text-navy" data-i18n="store.bannerT"></p>
          <p class="text-[13px] text-slate-600" data-i18n="store.bannerD"></p>
        </div>
      </div>

      <!-- Category tabs -->
      <div id="store-tabs" class="no-scrollbar -mx-4 mt-4 flex gap-2 overflow-x-auto px-4" role="tablist"></div>

      <!-- Filters: men / women, price range, price sort -->
      <div id="store-filters" class="mt-3 space-y-2.5"></div>

      <!-- Product grid -->
      <div id="store-grid" class="mt-3 grid grid-cols-2 gap-3"></div>

      <p class="mt-8 text-center text-xs text-slate-400">
        <span data-i18n="common.poweredBy"></span> · <span class="wordmark text-sm">দর্পণ</span>
      </p>
      <p class="mt-2 text-center">
        <a href="index.html#contact" class="inline-flex items-center gap-1 text-xs font-semibold text-accent hover:underline">
          <span data-icon="mail" class="h-3.5 w-3.5"></span><span data-i18n="contact.title"></span>
        </a>
      </p>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/shop.js"></script>
</body>
</html>
