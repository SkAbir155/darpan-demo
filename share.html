<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>দর্পণ — QR কোড ও লিংক</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-512.png">
  <meta name="theme-color" content="#1F3864">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div class="app-shell">
    <!-- Screen 5: QR code + shareable link -->
    <header id="site-header" data-variant="dashboard"></header>

    <main class="wrap pb-28 pt-4 md:pb-32 md:pt-8">
      <div class="mx-auto max-w-4xl">
      <h1 class="text-xl font-extrabold text-navy md:text-3xl" data-i18n="share.title"></h1>
      <p class="mt-1 text-sm text-slate-500 md:text-base" data-i18n="share.sub"></p>

      <div class="md:mt-6 md:grid md:grid-cols-2 md:items-start md:gap-8">
      <div>

      <!-- QR card -->
      <section class="mt-4 rounded-3xl bg-gradient-to-br from-navy to-accent p-[3px] shadow-lift">
        <div class="rounded-[calc(1.5rem-3px)] bg-white px-5 pb-5 pt-4 text-center">
          <div id="qr-shop" class="flex items-center justify-center gap-2"></div>

          <div class="relative mx-auto mt-3 w-fit p-3">
            <!-- Scan-frame corners -->
            <span class="absolute left-0 top-0 h-6 w-6 rounded-tl-xl border-l-4 border-t-4 border-accent"></span>
            <span class="absolute right-0 top-0 h-6 w-6 rounded-tr-xl border-r-4 border-t-4 border-accent"></span>
            <span class="absolute bottom-0 left-0 h-6 w-6 rounded-bl-xl border-b-4 border-l-4 border-accent"></span>
            <span class="absolute bottom-0 right-0 h-6 w-6 rounded-br-xl border-b-4 border-r-4 border-accent"></span>
            <!-- Real QR code, generated by qrcode.js -->
            <div id="qr-code" class="relative h-[200px] w-[200px]"></div>
            <span class="wordmark absolute left-1/2 top-1/2 flex h-11 w-11 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-xl bg-white text-lg shadow ring-2 ring-white">দ</span>
          </div>

          <p class="mt-2 flex items-center justify-center gap-1.5 text-sm font-bold text-navy">
            <span data-icon="sparkle" class="h-4 w-4 text-accent"></span>
            <span data-i18n="share.scan"></span>
          </p>
        </div>
      </section>

      <button id="download-qr" type="button" class="mt-4 flex w-full items-center justify-center gap-2 rounded-2xl bg-navy py-3.5 text-[15px] font-bold text-white shadow-lift active:scale-[.99]">
        <span data-icon="download" class="h-5 w-5"></span>
        <span data-i18n="share.download"></span>
      </button>
      </div>

      <div>

      <!-- Copyable link -->
      <div class="mt-5 md:mt-0">
        <label for="share-link" class="mb-1.5 flex items-center gap-1.5 text-sm font-semibold text-slate-700">
          <span data-icon="link" class="h-4 w-4 text-accent"></span>
          <span data-i18n="share.linkLabel"></span>
        </label>
        <div class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 p-1.5 pl-3">
          <input id="share-link" type="text" readonly class="min-w-0 flex-1 bg-transparent text-[15px] font-medium text-slate-700 outline-none">
          <button id="copy-link" type="button" class="flex shrink-0 items-center gap-1.5 rounded-lg bg-accent px-3.5 py-2 text-sm font-bold text-white">
            <span data-icon="copy" class="h-4 w-4"></span>
            <span data-i18n="share.copy"></span>
          </button>
        </div>
      </div>

      <!-- Share targets -->
      <div class="mt-5">
        <p class="text-sm font-semibold text-slate-700" data-i18n="share.shareOn"></p>
        <div class="mt-2 grid grid-cols-3 gap-2">
          <button type="button" data-share class="flex flex-col items-center gap-1 rounded-xl border border-slate-100 py-3 text-xs font-semibold text-slate-600 shadow-card">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-[#25D366] text-white"><span data-icon="chat" class="h-5 w-5"></span></span>WhatsApp
          </button>
          <button type="button" data-share class="flex flex-col items-center gap-1 rounded-xl border border-slate-100 py-3 text-xs font-semibold text-slate-600 shadow-card">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-[#1877F2] text-white"><span data-icon="facebook" class="h-5 w-5"></span></span>Facebook
          </button>
          <button type="button" data-share class="flex flex-col items-center gap-1 rounded-xl border border-slate-100 py-3 text-xs font-semibold text-slate-600 shadow-card">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-700 text-white"><span data-icon="printer" class="h-5 w-5"></span></span><span data-i18n="share.printBtn"></span>
          </button>
        </div>
      </div>

      <a href="shop.html" class="mt-5 flex items-center justify-between rounded-2xl bg-navy-50 px-4 py-3.5 font-semibold text-navy">
        <span class="flex items-center gap-2"><span data-icon="eye" class="h-5 w-5"></span><span data-i18n="share.preview"></span></span>
        <span data-icon="chevronRight" class="h-5 w-5"></span>
      </a>

      <p class="mt-4 flex items-start gap-2 text-xs text-slate-500">
        <span data-icon="printer" class="mt-0.5 h-4 w-4 shrink-0"></span>
        <span data-i18n="share.print"></span>
      </p>
      </div>
      </div>
      </div>
    </main>

    <nav id="bottom-nav" data-active="qr"></nav>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/share.js"></script>
</body>
</html>
