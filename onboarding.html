<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>দর্পণ — কীভাবে শুরু করবেন</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <!-- Screen 3: Onboarding tutorial (add ?step=1..4 to open a specific step) -->
  <div class="app-shell flex min-h-screen flex-col">
    <header id="site-header" data-variant="minimal" data-skip="collection.html"></header>

    <main class="flex flex-1 flex-col px-5 pb-6">
      <!-- Step indicator -->
      <div class="pt-2">
        <p id="step-label" class="text-sm font-semibold text-accent"></p>
        <div id="step-bars" class="mt-2 grid grid-cols-4 gap-1.5"></div>
      </div>

      <!-- Illustration -->
      <div class="flex flex-1 items-center justify-center py-6">
        <div id="step-illustration" class="relative h-64 w-64"></div>
      </div>

      <!-- Copy -->
      <div class="text-center">
        <h1 id="step-title" class="text-2xl font-extrabold text-navy"></h1>
        <p id="step-desc" class="mx-auto mt-2 max-w-xs text-[15px] text-slate-600"></p>
        <div class="mx-auto mt-4 flex max-w-xs items-start gap-2 rounded-xl bg-amber-50 px-3 py-2.5 text-left text-[13px] text-amber-900">
          <span data-icon="sun" class="mt-0.5 h-4 w-4 shrink-0"></span>
          <p><b data-i18n="onb.tip"></b>: <span id="step-tip"></span></p>
        </div>
      </div>

      <!-- Controls -->
      <div class="mt-6 flex items-center gap-3">
        <button id="prev-btn" type="button" class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl border border-slate-200 text-navy disabled:opacity-30" aria-label="Previous">
          <span data-icon="back" class="h-6 w-6"></span>
        </button>
        <button id="next-btn" type="button" class="flex h-14 flex-1 items-center justify-center gap-2 rounded-2xl bg-navy text-base font-bold text-white shadow-lift active:scale-[.99]">
          <span id="next-label"></span>
          <span data-icon="arrowRight" class="h-5 w-5"></span>
        </button>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/onboarding.js"></script>
</body>
</html>
