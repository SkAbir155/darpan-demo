<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>পণ্যের বিবরণ — দর্পণ</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-512.png">
  <meta name="theme-color" content="#1F3864">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://yisol-idm-vton.hf.space" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <!-- Screen 7: Product detail + try-on. ?id=<productId>
       One tap on "আপনার ছবি দিয়ে ট্রাই করুন" opens the phone gallery. -->
  <div class="app-shell">
    <header id="site-header" data-variant="customer" data-back="shop.html"></header>

    <main class="wrap pb-10 md:grid md:grid-cols-2 md:items-start md:gap-10 md:pt-8">
      <!-- Product photo: edge-to-edge on phones, rounded card on bigger screens -->
      <div class="bleed md:sticky md:top-20">
        <div id="product-media" class="relative aspect-square overflow-hidden bg-slate-100 md:aspect-[4/5] md:rounded-3xl md:shadow-card"></div>
      </div>

      <div>
        <div id="product-head" class="pt-4 md:pt-0"></div>

        <!-- Try-on panel -->
        <section id="try" class="relative mt-4 scroll-mt-20 overflow-hidden rounded-3xl bg-gradient-to-br from-navy to-accent p-4 text-white shadow-lift md:p-6">
          <div class="dot-grid pointer-events-none absolute inset-0"></div>
          <div class="relative">
            <span class="inline-flex items-center gap-1.5 rounded-full bg-white/15 px-2.5 py-1 text-[11px] font-bold ring-1 ring-white/20">
              <span class="h-2 w-2 rounded-full bg-emerald-400"></span><span data-i18n="ai.free"></span>
            </span>

            <button type="button" data-pick class="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl bg-white py-3.5 text-[15px] font-bold text-navy shadow-card active:scale-[.99]">
              <span data-icon="sparkle" class="h-5 w-5 text-accent"></span>
              <span data-i18n="prod.tryCta"></span>
            </button>

            <div class="mt-3 grid grid-cols-2 gap-2.5">
              <button type="button" data-pick class="flex flex-col items-start gap-2 rounded-2xl bg-white/10 p-3 text-left ring-1 ring-white/20 hover:bg-white/20">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/15"><span data-icon="gallery" class="h-5 w-5"></span></span>
                <span class="text-sm font-bold leading-snug" data-i18n="prod.gallery"></span>
              </button>
              <!-- Camera: not enabled yet. TODO: getUserMedia() capture. -->
              <button type="button" disabled class="relative flex cursor-not-allowed flex-col items-start gap-2 rounded-2xl bg-white/5 p-3 text-left opacity-60 ring-1 ring-white/10">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/10"><span data-icon="camera" class="h-5 w-5"></span></span>
                <span class="text-sm font-bold leading-snug" data-i18n="prod.camera"></span>
                <span class="absolute right-2 top-2 rounded-full bg-amber-400 px-1.5 py-0.5 text-[9px] font-bold text-amber-950" data-i18n="prod.cameraSoon"></span>
              </button>
            </div>

            <!-- Photo tips, visible before choosing a photo -->
            <p class="mt-4 text-[11px] font-bold uppercase tracking-wide text-white/60" data-i18n="prod.tipsTitle"></p>
            <div class="mt-1.5 grid grid-cols-3 gap-2 text-center text-[11px] font-medium text-white/90">
              <div class="rounded-xl bg-white/10 py-2"><span data-icon="user2" class="mx-auto block h-4 w-4"></span><span class="mt-1 block" data-i18n="prod.tip1"></span></div>
              <div class="rounded-xl bg-white/10 py-2"><span data-icon="sun" class="mx-auto block h-4 w-4"></span><span class="mt-1 block" data-i18n="prod.tip2"></span></div>
              <div class="rounded-xl bg-white/10 py-2"><span data-icon="shirt" class="mx-auto block h-4 w-4"></span><span class="mt-1 block" data-i18n="prod.tip3"></span></div>
            </div>

            <p id="clothing-note" class="mt-3 hidden rounded-xl bg-white/10 px-3 py-2 text-[12px] text-white/85" data-i18n="ai.clothingOnly"></p>
            <p class="mt-3 flex items-center gap-1.5 text-[12px] text-white/75">
              <span data-icon="lock" class="h-3.5 w-3.5 shrink-0"></span>
              <span data-i18n="prod.privacy"></span>
            </p>
          </div>
        </section>

        <div id="product-options"></div>

        <section class="mt-5">
          <h2 class="text-sm font-bold text-slate-900" data-i18n="prod.details"></h2>
          <p id="product-desc" class="mt-1 text-sm text-slate-600"></p>
        </section>
      </div>
    </main>

    <!-- Hidden file input behind every data-pick button -->
    <input id="photo-input" type="file" accept="image/*" class="hidden">

    <!-- Try-on progress screen -->
    <div id="processing" class="fixed inset-0 z-[70] hidden flex-col items-center justify-center bg-navy-900/95 px-8 text-center text-white" role="status" aria-live="polite">
      <div id="processing-media" class="relative h-64 w-48 overflow-hidden rounded-3xl ring-4 ring-white/20 md:h-80 md:w-60"></div>
      <p id="processing-text" class="mt-6 text-lg font-bold"></p>
      <p id="processing-sub" class="mt-1 min-h-[1.25rem] text-sm text-white/65"></p>
      <div class="mx-auto mt-5 h-1.5 w-60 overflow-hidden rounded-full bg-white/15">
        <div id="processing-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-accent to-sky-300 transition-[width] ease-linear"></div>
      </div>
      <ol id="processing-steps" class="mt-5 flex items-center gap-2 text-[11px] font-semibold"></ol>
      <button type="button" id="processing-cancel" class="mt-7 rounded-full px-4 py-2 text-sm font-semibold text-white/70 ring-1 ring-white/25 hover:bg-white/10" data-i18n="proc.cancel"></button>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tryon-ai.js"></script>
  <script src="assets/js/pages/product.js"></script>
</body>
</html>
